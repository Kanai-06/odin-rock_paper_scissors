<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifoumi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Shifoumi.</h1>
    <button>Start</button>
    <div id="score">
        <div class="user">
            <img src="img/user.svg">
            <h2>User</h2>
        </div>
        <h2 id="score-text">0 - 0</h2>
        <div class="bot">
            <img src="img/bot.svg">
            <h2>Bot</h2>
        </div> 
    </div>
    <div id="message"></div>
    <div id="UserChoice">
        <div id="rock"><img src="img/rock.png"><p>rock</p></div>
        <div id="paper"><img src="img/paper.png"><p>paper</p></div>
        <div id="scissors"><img src="img/scissors.png"><p>scissors</p></div>
    </div>
    
    
</body>
</html>
