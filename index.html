<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifoumi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Shifoumi.</h1>
    <div id="score">
        <div class="user">
            <img src="img/user.svg">
            <p>User</p>
        </div>
        <p></p>
        <div class="bot">
            <img src="img/bot.svg">
            <p>Bot</p>

    </div>

        <div id="paper"><img src="img/paper.png"><p>paper</p></div>
        <div id="scissors"><img src="img/scissors.png"><p>scissors</p></div>
    </div>
    <div id="message"></div>
    <div id="MatchHistory"></div>
